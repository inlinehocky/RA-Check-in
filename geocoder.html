const delay = ms => new Promise(r => setTimeout(r, ms));

function log(msg, cls='') {
  const d = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  d.appendChild(line);
  d.scrollTop = d.scrollHeight;
}

async function geocone(b) {
  const q = encodeURIComponent(`${b.address}, ${b.city}, ${b.state} ${b.zip}, USA`);
  const url = `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=us`;
  const resp = await fetch(url, { headers: { 'Accept-Language': 'en', 'User-Agent': 'RAPartsGeocoder/1.0' } });
  const data = await resp.json();
  if (data && data.length > 0) {
    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), matched: data[0].display_name };
  }
  return null;
}

async function startGeocoding() {
  document.getElementById('start-btn').disabled = true;
  const results = [];
  const missed = [];

  for (let i = 0; i < businesses.length; i++) {
    const b = businesses[i];
    document.getElementById('progress').textContent = `Processing ${i+1}/${businesses.length}: ${b.business_name}`;
    try {
      const r = await geocone(b);
      if (r) {
        results.push({ ...b, lat: r.lat, lng: r.lng });
        log(`✓ ${b.account_number.padEnd(8)} ${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}  ${b.business_name}`, 'ok');
      } else {
        missed.push(b);
        log(`✗ ${b.account_number.padEnd(8)} NO MATCH — ${b.address}, ${b.city}`, 'miss');
      }
    } catch(e) {
      missed.push(b);
      log(`! ${b.account_number.padEnd(8)} ERROR: ${e.message}`, 'err');
    }
    await delay(1100); // Nominatim rate limit: 1 req/sec
  }

  document.getElementById('progress').textContent =
    `Done: ${results.length}/${businesses.length} geocoded. ${missed.length} no match.`;

  // Build SQL
  const lines = [
    `-- Lat/Lng UPDATE for ${results.length} businesses`,
    `-- Generated: ${new Date().toISOString()}`,
    `-- ${missed.length} addresses could not be geocoded (listed at bottom)`,
    ``,
    `-- Apply to BOTH dev (zzmvtvyksfyvbokhqpwf) and prod (kxchucwedudvlqzszqpp)`,
    ``
  ];

  for (const r of results) {
    lines.push(`UPDATE businesses SET latitude = ${r.lat}, longitude = ${r.lng} WHERE account_number = '${r.account_number}';`);
  }

  if (missed.length) {
    lines.push(``, `-- Could NOT geocode (${missed.length} businesses):`);
    for (const m of missed) {
      lines.push(`-- ${m.account_number.padEnd(8)} ${m.business_name} | ${m.address}, ${m.city}, ${m.state} ${m.zip}`);
    }
  }

  document.getElementById('sql-out').value = lines.join('\n');
  document.getElementById('copy-btn').disabled = false;
}

function copySql() {
  const ta = document.getElementById('sql-out');
  ta.select();
  document.execCommand('copy');
  document.getElementById('copy-btn').textContent = '✓ Copied!';
  setTimeout(() => document.getElementById('copy-btn').textContent = '📋 Copy SQL', 2000);
}
